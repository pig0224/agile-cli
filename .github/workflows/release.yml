name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish agile-cli to npm & create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::package.json version $VERSION does not match tag $TAG"
            exit 1
          fi

      # typecheck/test 由 main 上的 CI 已对该 commit 验证（tag 与 main 同 commit），此处不重复
      - name: Build
        run: pnpm build

      - name: Extract release notes from CHANGELOG
        run: node scripts/extract-release-notes.mjs "$GITHUB_REF_NAME" RELEASE_NOTES.md

      - name: Publish fcc-agile-cli
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
